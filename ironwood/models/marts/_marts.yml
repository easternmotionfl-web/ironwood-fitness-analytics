version: 2

models:
  - name: dim_locations
    description: "One row per gym, with how many months it was open in the data window."
    columns:
      - name: location_id
        description: "Unique ID for each gym."
        data_tests: [unique, not_null]
      - name: months_open_in_window
        description: "Months the gym was open between the window start and the as-of date. Use it to compare gyms fairly."

  - name: dim_plans
    description: "One row per plan tier (Basic, Standard, Premium) with its monthly price."
    columns:
      - name: plan_id
        description: "Unique ID for each plan."
        data_tests: [unique, not_null]

  - name: dim_members
    description: "One row per member who ever joined, with their current plan and status taken from their latest membership row."
    columns:
      - name: member_id
        description: "Unique ID for each member."
        data_tests: [unique, not_null]
      - name: current_status
        description: "active if the latest membership row is still running, churned if it was cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'churned']
      - name: location_id
        description: "The member's home gym."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_id
      - name: tenure_days
        description: "Days from joining to the churn date, or to the as-of date if still active."

  - name: fct_memberships
    description: "One row per plan period. A plan change ends one row and starts another. The base for active members, churn and tenure."
    semantic_model:
      enabled: true
    agg_time_dimension: start_date
    columns:
      - name: membership_id
        description: "Unique ID for each plan period."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: membership
      - name: member_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
        entity:
          type: foreign
          name: member
      - name: location_id
        description: "The member's home gym."
        entity:
          type: foreign
          name: location
      - name: plan_id
        entity:
          type: foreign
          name: plan
      - name: start_date
        description: "First day of this plan period."
        granularity: day
        dimension:
          type: time
      - name: end_date
        description: "Last day of this plan period. Empty while still active."
        granularity: day
        dimension:
          type: time
      - name: plan_name
        description: "The plan held during this period: Basic, Standard or Premium."
        dimension:
          type: categorical
      - name: status
        description: "How the period ended: active (still running), changed (plan change) or cancelled."
        dimension:
          type: categorical
      - name: cancel_reason
        description: "The member's stated reason, for cancelled periods only."
        dimension:
          type: categorical
      - name: member_days
        description: "Days this plan period covered. Monthly churn rate = cancellations / (member_days / 30)."
      - name: is_cancelled_first_90_days
        description: "True if the member cancelled within 90 days of first joining."
    metrics:
      - name: cancellations
        description: "Plan periods that ended with status cancelled. A plan change is not a cancellation."
        type: simple
        agg: count
        expr: 1
        agg_time_dimension: end_date
        filter: "{{ Dimension('membership__status') }} = 'cancelled'"
      - name: member_months
        description: "Member-days divided by 30. The denominator for monthly rates."
        type: simple
        agg: sum
        expr: "member_days / 30.0"

  - name: fct_check_ins
    description: "One row per gym visit, with the plan the member held on the visit date."
    semantic_model:
      enabled: true
    agg_time_dimension: check_in_date
    columns:
      - name: check_in_id
        description: "Unique ID for each visit."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: check_in
      - name: member_id
        entity:
          type: foreign
          name: member
      - name: membership_id
        description: "The plan period covering the visit date. Never empty: every visit falls inside a membership."
        data_tests: [not_null]
        entity:
          type: foreign
          name: membership
      - name: location_id
        entity:
          type: foreign
          name: location
      - name: check_in_date
        description: "Date of the visit."
        granularity: day
        dimension:
          type: time
      - name: check_in_hour
        description: "Hour of the visit, from 5 (5am) to 22 (10pm)."
        dimension:
          type: categorical
      - name: plan_name
        description: "The plan held on the visit date."
        dimension:
          type: categorical
    metrics:
      - name: visits
        description: "Gym visits (check-ins). Compare groups with visits_per_member_month, not raw visits."
        type: simple
        agg: count
        expr: 1

  - name: fct_payments
    description: "One row per monthly charge attempt. Revenue counts only paid charges."
    semantic_model:
      enabled: true
    agg_time_dimension: charge_date
    columns:
      - name: payment_id
        description: "Unique ID for each charge attempt."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: payment
      - name: member_id
        entity:
          type: foreign
          name: member
      - name: membership_id
        entity:
          type: foreign
          name: membership
      - name: location_id
        entity:
          type: foreign
          name: location
      - name: charge_date
        description: "Date the charge was attempted."
        granularity: day
        dimension:
          type: time
      - name: plan_name
        description: "The plan the member was charged for."
        dimension:
          type: categorical
      - name: status
        description: "paid or failed. Failed charges are not retried."
        dimension:
          type: categorical
      - name: revenue
        description: "The amount if the charge was paid, 0 if it failed. Sum this for revenue."
        data_tests: [not_null]
    metrics:
      - name: revenue
        description: "Money collected from paid charges."
        type: simple
        agg: sum
        expr: revenue
      - name: charge_attempts
        description: "All monthly charge attempts, paid or failed."
        type: simple
        agg: count
        expr: 1
      - name: failed_charges
        description: "Charge attempts that failed."
        type: simple
        agg: count
        expr: 1
        filter: "{{ Dimension('payment__status') }} = 'failed'"      

  - name: fct_member_days
    description: "One row per member per day they were a member. The base for active members on a date, and for member-months split correctly by month."
    semantic_model:
      enabled: true
    agg_time_dimension: date_day
    columns:
      - name: member_day_id
        description: "Unique ID for each member-day: the membership ID plus the date."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: member_day
      - name: membership_id
        entity:
          type: foreign
          name: membership
      - name: member_id
        entity:
          type: foreign
          name: member
      - name: location_id
        entity:
          type: foreign
          name: location
      - name: date_day
        description: "A day the member held this membership."
        granularity: day
        dimension:
          type: time
      - name: plan_name
        description: "The plan held on this day."
        dimension:
          type: categorical
    metrics:
      - name: active_members
        description: "Distinct members with a membership covering the date. Ask for one day, usually the last day of a period. The end date counts as the member's last day."
        type: simple
        agg: count_distinct
        expr: member_id
      - name: member_months_by_day
        description: "Member-days divided by 30, counted on the day they happened. Use this for monthly or yearly rates."
        type: simple
        agg: sum
        expr: "1 / 30.0"

metrics:
  - name: monthly_churn_rate
    description: "Cancellations per member-month. Counts members for the days they were actually members, so partial months are fair."
    type: ratio
    numerator: cancellations
    denominator: member_months
  - name: failed_payment_rate
    description: "Share of charge attempts that failed."
    type: ratio
    numerator: failed_charges
    denominator: charge_attempts 
  - name: visits_per_member_month
    description: "Visits per member-month. The fair way to compare how often members visit across plans or gyms."
    type: ratio
    numerator: visits
    denominator: member_months
  - name: churn_rate_over_time
    description: "Cancellations per member-month, with each member-day counted in the period it happened. Use this for churn by month or year."
    type: ratio
    numerator: cancellations
    denominator: member_months_by_day  
