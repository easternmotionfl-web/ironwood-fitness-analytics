version: 2

models:
  - name: stg_locations
    columns:
      - name: location_id
        data_tests: [unique, not_null]

  - name: stg_plans
    columns:
      - name: plan_id
        data_tests: [unique, not_null]

  - name: stg_members
    columns:
      - name: member_id
        data_tests: [unique, not_null]
      - name: join_date
        data_tests: [not_null]
      - name: home_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_locations')
                field: location_id
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['Female', 'Male', 'Not given']

  - name: stg_memberships
    columns:
      - name: membership_id
        data_tests: [unique, not_null]
      - name: start_date
        data_tests: [not_null]
      - name: member_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: plan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'changed', 'cancelled']

  - name: stg_check_ins
    columns:
      - name: check_in_id
        data_tests: [unique, not_null]
      - name: member_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_members')
                field: member_id
      - name: location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_locations')
                field: location_id

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: amount
        data_tests: [not_null]
      - name: membership_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_memberships')
                field: membership_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'failed']

  - name: stg_cancellations
    columns:
      - name: cancellation_id
        data_tests: [unique, not_null]
      - name: membership_id
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('stg_memberships')
                field: membership_id
